<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta SUNAT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #resultado {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            display: none;
            white-space: pre-wrap;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Consulta SUNAT</h1>
    
    <div class="form-group">
        <label for="tipoDocumento">Tipo de documento:</label>
        <select id="tipoDocumento">
            <option value="ruc">RUC</option>
            <option value="dni">DNI</option>
            <option value="ce">Carnet de Extranjería</option>
            <option value="pasaporte">Pasaporte</option>
            <option value="diplomatico">Cédula Diplomática</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="documento">Número de documento:</label>
        <input type="text" id="documento" placeholder="Ingrese el número de documento">
    </div>
    
    <button onclick="consultarSunat()">Consultar</button>
    
    <div id="resultado"></div>

    <script>
        async function consultarSunat() {
            const documento = document.getElementById('documento').value;
            const tipo = document.getElementById('tipoDocumento').value;
            
            if (!documento) {
                alert('Por favor ingrese un número de documento');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:9101/sunat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        tipo: tipo,
                        documento: documento 
                    })
                });
                
                const data = await response.json();
                
                const resultadoDiv = document.getElementById('resultado');
                resultadoDiv.innerHTML = `<strong>Razón Social:</strong> ${data.razon_social}<br><strong>Actividades:</strong> ${data.actividades}`;
                resultadoDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Ocurrió un error al consultar el servicio');
            }
        }
    </script>
</body>
</html>
